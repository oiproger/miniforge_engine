name: Native builds (Windows, macOS, Linux)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      project:
        description: 'Path to a project JSON or .miniforge archive in this checkout. Leave empty for Coin Rush.'
        type: string
        required: false

permissions:
  contents: write

jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || matrix.app == 'editor'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
        app: [editor, game]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux WebView development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev build-essential file libxdo-dev

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build editor frontend
        if: matrix.app == 'editor'
        run: pnpm build

      - name: Export game bundle
        if: matrix.app == 'game'
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project }}
        run: |
          node packages/exporter/prepare.mjs
          if [[ -n "$PROJECT_PATH" ]]; then
            pnpm exec tsx packages/exporter/cli.ts "$PROJECT_PATH" web dist/games
          else
            pnpm exec tsx packages/exporter/cli.ts
          fi

      - name: Build native Tauri bundle
        run: node apps/editor-desktop/build.mjs ${{ matrix.app }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniforge-${{ matrix.app }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/editor-desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/editor-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/editor-desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/editor-desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/editor-desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Attach editor installers to GitHub Release
        if: github.event_name == 'release' && matrix.app == 'editor'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/editor-desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/editor-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/editor-desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/editor-desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/editor-desktop/src-tauri/target/release/bundle/dmg/*.dmg
